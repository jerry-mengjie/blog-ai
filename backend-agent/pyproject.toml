# 项目元数据与依赖声明, 使用 uv 进行依赖与虚拟环境管理
[project]
# 项目名称
name = "backend-agent"
# 项目版本
version = "0.1.0"
# 项目描述
description = "AI 编排微服务 FastAPI + LangGraph + LangChain"
# 要求的最低 Python 版本
requires-python = ">=3.11"
# 运行时依赖列表
dependencies = [
    "fastapi>=0.115.0",                   # Web 框架
    "uvicorn[standard]>=0.30.0",          # ASGI 服务器(含 uvloop/httptools)
    "pydantic>=2.7.0",                    # 数据校验与序列化
    "pydantic-settings>=2.3.0",           # 读取 .env 配置
    "httpx>=0.27.0",                      # 异步 HTTP 客户端(调用 blog / rag)
    "langgraph>=1.2.9",                   # 有状态图编排: 问答图 + 推荐图
    "langchain-core>=1.0.0",              # LCEL 提示词/输出解析/Runnable 协议
    "langchain-openai>=1.3.5",            # ChatOpenAI(OpenAI 兼容, 对接阿里云百炼)
    "python-jose[cryptography]>=3.3.0",   # 解析 backend-blog 签发的 JWT
    "redis[hiredis]>=5.0.0",              # 推荐结果 L2 缓存 + 分布式限流
]

# 开发依赖分组(uv / PEP 735)
[dependency-groups]
dev = [
    "ruff>=0.5.0",  # 代码风格检查与格式化
]

# 构建系统(供打包使用)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 指定打包包含的源码目录
[tool.hatch.build.targets.wheel]
packages = ["app"]
